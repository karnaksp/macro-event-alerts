name: Runtime
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run runtime acceptance tests
        run: uv run pytest -q

  docker-replay:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build runtime image
        run: docker compose --project-name macro-alerts-ci build
      - name: Replay and capture persisted state
        run: |
          docker compose --project-name macro-alerts-ci run --rm replay replay --config /app/config.replay.yaml --fixture /app/examples/replay/demo.jsonl
          docker compose --project-name macro-alerts-ci run --rm replay status --state /data/state.db > before.json
      - name: Restart replay with the same volume
        run: |
          docker compose --project-name macro-alerts-ci run --rm replay replay --config /app/config.replay.yaml --fixture /app/examples/replay/demo.jsonl
          docker compose --project-name macro-alerts-ci run --rm replay status --state /data/state.db > after.json
          docker compose --project-name macro-alerts-ci run --rm replay health --state /data/state.db
      - name: Verify restart deduplication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('before.json').read_text())
          after = json.loads(Path('after.json').read_text())
          assert before['counts']['events'] > 0, before
          assert before['counts'] == after['counts'], (before, after)
          assert before['event_ids'] == after['event_ids'], (before, after)
          print('Persisted counts and event IDs are unchanged after restart.')
          PY
      - name: Verify non-root user
        run: test "$(docker compose --project-name macro-alerts-ci run --rm --entrypoint id replay -u)" = 10001
      - name: Remove CI state
        if: always()
        run: docker compose --project-name macro-alerts-ci down --volumes --remove-orphans
