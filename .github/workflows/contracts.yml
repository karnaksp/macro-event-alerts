name: Contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Install locked contract dependencies
        run: uv sync --locked
      - name: Validate schemas, examples and negative cases
        run: uv run python scripts/validate_contracts.py
