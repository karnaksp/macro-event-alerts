name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.paths.outputs.checks }}
      image: ${{ steps.paths.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          event = os.environ['EVENT_NAME']
          base = os.environ.get('PR_BASE_SHA') if event == 'pull_request' else os.environ.get('BEFORE_SHA')
          head = os.environ.get('PR_HEAD_SHA') if event == 'pull_request' else 'HEAD'
          full = event == 'workflow_dispatch' or not base or not re.fullmatch(r'[0-9a-f]{40}', base) or set(base) == {'0'}
          paths = []
          if not full:
              result = subprocess.run(['git', 'diff', '--name-only', f'{base}...{head}' if event == 'pull_request' else f'{base}..{head}'], capture_output=True, text=True)
              full = result.returncode != 0
              paths = result.stdout.splitlines()
          common = ('src/', 'contracts/', 'pyproject.toml', 'uv.lock', 'config.')
          checks = full or any(p.startswith(common + ('tests/', 'examples/', 'scripts/', '.github/workflows/')) for p in paths)
          image = full or any(p.startswith(common + ('Dockerfile', '.dockerignore', 'compose.yaml', 'examples/replay/', 'scripts/docker_smoke.py', '.github/workflows/')) for p in paths)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'checks={str(checks).lower()}\nimage={str(image).lower()}\n')
          print(f'Checks: {checks}; image: {image}; changed files: {len(paths)}')
          PY

  checks:
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-
      - name: Install uv
        run: python -m pip install uv==0.11.19
      - name: Install locked dependencies once
        run: uv sync --locked
      - name: Runtime tests and contract examples
        run: |
          uv run --locked pytest -q
          uv run --locked python scripts/validate_contracts.py

  image:
    needs: [changes, checks]
    if: ${{ always() && !cancelled() && needs.changes.outputs.image == 'true' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: macro-event-alerts:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: One offline image smoke with process restart
        run: |
          docker compose config --quiet
          docker run --rm --network none --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16777216 --volume "$PWD/scripts/docker_smoke.py:/checks.py:ro" --entrypoint python macro-event-alerts:ci /checks.py
