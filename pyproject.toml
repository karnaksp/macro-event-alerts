[project]
name = "macro-event-alerts"
version = "0.2.0"
description = "Macroeconomic API alerts with durable Telegram delivery"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5", "pyyaml>=6,<7", "rfc3339-validator>=0.1.4,<1"]

[project.scripts]
macro-event-alerts = "macro_event_alerts.cli:main"

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_event_alerts"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/v1" = "macro_event_alerts/contracts/v1"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
